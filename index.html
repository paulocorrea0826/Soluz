<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090919">
<title>Oráculo dos Arcanjos</title>

<style>
:root {
  color-scheme: dark;
  --gold: #ffe6a1;
  --cream: #fff9ed;
  --art: url('./arcanjos-realistas.png');
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080817;
  color: var(--cream);
  font-family: Georgia, 'Times New Roman', serif;
}

.screen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: var(--art) center 52% / cover no-repeat;
}

.screen:before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    #08081788 0%,
    transparent 22%,
    transparent 66%,
    #0808179c 100%
  );
}

.screen:after {
  content: "";
  position: absolute;
  inset: -10%;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  transform: scale(.12);
  mix-blend-mode: screen;
  background: radial-gradient(
    circle at 50% 55%,
    #fff 0,
    #fffde2 7%,
    #fff6c5d9 15%,
    #ffe7859c 27%,
    #ffdc6166 43%,
    transparent 63%
  );
}

.screen.flare:after {
  animation: solar-burst 1.45s cubic-bezier(.16, .78, .25, 1) both;
}

.screen.flare {
  animation: screen-flash 1.15s ease-out;
}

@keyframes solar-burst {
  0% {
    opacity: 0;
    transform: scale(.12);
  }
  12% {
    opacity: 1;
  }
  42% {
    opacity: .94;
    transform: scale(1.05);
  }
  100% {
    opacity: 0;
    transform: scale(2.2);
  }
}

@keyframes screen-flash {
  0%, 100% {
    filter: brightness(1);
  }
  19% {
    filter: brightness(1.65) saturate(1.25);
  }
  52% {
    filter: brightness(1.15);
  }
}

.angel-motion {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: var(--art) center 52% / cover no-repeat;
  filter: drop-shadow(0 0 10px #fff2c422);
  animation: angel-breathe 4.5s ease-in-out infinite;
  transform-origin: 50% 50%;
}

.a1 {
  clip-path: ellipse(25% 21% at 50% 26%);
  animation-delay: -1.1s;
}

.a2 {
  clip-path: ellipse(20% 19% at 20% 42%);
  animation-delay: -2.6s;
}

.a3 {
  clip-path: ellipse(20% 19% at 80% 42%);
  animation-delay: -.5s;
}

.a4 {
  clip-path: ellipse(19% 18% at 20% 63%);
  animation-delay: -3.2s;
}

.a5 {
  clip-path: ellipse(19% 18% at 80% 63%);
  animation-delay: -1.8s;
}

.a6 {
  clip-path: ellipse(20% 20% at 21% 85%);
  animation-delay: -.9s;
}

.a7 {
  clip-path: ellipse(20% 20% at 79% 85%);
  animation-delay: -2.2s;
}

@keyframes angel-breathe {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-3px) scale(1.003);
  }
}

.top {
  position: absolute;
  z-index: 8;
  left: 16px;
  right: 16px;
  top: max(18px, env(safe-area-inset-top));
  text-align: center;
  text-shadow: 0 2px 15px #05040e;
}

.eyebrow {
  font: 10px Arial, sans-serif;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--gold);
}

h1 {
  font-weight: 400;
  font-size: clamp(26px, 6.5vw, 46px);
  line-height: 1.04;
  margin: 8px 0 7px;
  text-shadow: 0 0 24px #ffd98a8a;
}

.intro {
  font: 13px/1.4 Arial, sans-serif;
  color: #fff2dc;
  margin: 0 auto;
  max-width: 340px;
}

.music-toggle {
  position: absolute;
  z-index: 11;
  top: max(13px, env(safe-area-inset-top));
  right: 12px;
  width: 43px;
  height: 43px;
  border: 1px solid #ffe9b099;
  border-radius: 50%;
  background: #100d25b8;
  backdrop-filter: blur(8px);
  color: #fff4d2;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 0 18px #ffd96644;
}

.music-toggle[aria-pressed="true"] {
  color: #ffe18a;
  box-shadow: 0 0 22px #ffe18a99, inset 0 0 13px #ffe18a33;
}

.music-toggle:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.music-status {
  position: absolute;
  right: 9px;
  top: calc(max(13px, env(safe-area-inset-top)) + 48px);
  z-index: 11;
  font: 9px Arial, sans-serif;
  color: #fff4d2;
  opacity: .9;
  text-shadow: 0 1px 5px #000;
  pointer-events: none;
}

.sun-button {
  position: absolute;
  z-index: 7;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  width: min(70vw, 440px);
  aspect-ratio: 1;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.sun-button:focus-visible {
  outline: 2px solid #fff4bd;
  outline-offset: 6px;
}

.sun-button:before {
  content: "";
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  box-shadow: 0 0 35px 10px #fff1a844;
  transition: box-shadow .3s, transform .3s;
}

.sun-button:hover:before,
.sun-button:focus-visible:before {
  transform: scale(1.08);
  box-shadow: 0 0 44px 18px #fff1a888;
}

.sun-button:active {
  transform: translate(-50%, -50%) scale(.97);
}

.tap-hint {
  position: absolute;
  left: 50%;
  top: calc(55% + min(35vw, 210px));
  transform: translateX(-50%);
  z-index: 8;
  white-space: nowrap;
  border: 1px solid #ffe9b077;
  border-radius: 999px;
  padding: 8px 14px;
  background: #100d25a8;
  backdrop-filter: blur(8px);
  font: 11px Arial, sans-serif;
  letter-spacing: .08em;
  color: #fff6db;
  text-shadow: 0 1px 8px #000;
  pointer-events: none;
  animation: hint-glow 2.2s ease-in-out infinite;
  transition: opacity .25s;
}

@keyframes hint-glow {
  50% {
    box-shadow: 0 0 20px #ffd96677;
    color: white;
  }
}

.message {
  position: absolute;
  z-index: 9;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  width: min(84vw, 410px);
  padding: 23px 21px 20px;
  border: 1px solid #fff0b6;
  border-radius: 24px;
  background: linear-gradient(145deg, #1c1739e8, #231b38d9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow:
    0 0 16px #fff1bdc9,
    0 0 52px 14px #ffdb78a6,
    inset 0 0 34px #ffe9a333;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
}

.message.hidden {
  display: none;
}

.message.visible {
  animation: deep-emerge 1.65s cubic-bezier(.16, .86, .2, 1) both;
}

@keyframes deep-emerge {
  0% {
    opacity: 0;
    clip-path: circle(0% at 50% 50%);
    transform: translate(-50%, -50%) scale(.08);
    filter: brightness(3.3) blur(12px);
    box-shadow: 0 0 0 #fff;
  }
  22% {
    opacity: .35;
    clip-path: circle(18% at 50% 50%);
    transform: translate(-50%, -50%) scale(.32);
    filter: brightness(2.4) blur(5px);
    box-shadow: 0 0 80px 40px #fff1aacc;
  }
  58% {
    opacity: 1;
    clip-path: circle(85% at 50% 50%);
    transform: translate(-50%, -50%) scale(1.06);
    filter: brightness(1.3) blur(0);
    box-shadow:
      0 0 26px #fff1bd,
      0 0 80px 25px #ffdb78b5,
      inset 0 0 40px #ffe9a355;
  }
  100% {
    opacity: 1;
    clip-path: circle(150% at 50% 50%);
    transform: translate(-50%, -50%) scale(1);
    filter: brightness(1);
    box-shadow:
      0 0 16px #fff1bdc9,
      0 0 52px 14px #ffdb78a6,
      inset 0 0 34px #ffe9a333;
  }
}

.label {
  font: 10px Arial, sans-serif;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
}

.quote {
  font-size: clamp(20px, 5.4vw, 27px);
  line-height: 1.38;
  margin: 12px 0 9px;
  text-shadow: 0 1px 10px #000;
}

.source {
  font: 11px Arial, sans-serif;
  color: #e1d5e9;
}

.dismiss {
  font: 9px Arial, sans-serif;
  color: #ffe9bcaa;
  margin-top: 12px;
  letter-spacing: .09em;
}

.footer {
  position: absolute;
  z-index: 8;
  left: 12px;
  right: 12px;
  bottom: max(17px, env(safe-area-inset-bottom));
  text-align: center;
  color: #fff1d4;
  font: 11px Arial, sans-serif;
  letter-spacing: .04em;
  text-shadow: 0 2px 12px #000;
}

.star {
  color: var(--gold);
}

@media (min-width: 700px) {
  .screen {
    background-position: center 52%;
  }
  .top {
    top: 28px;
  }
  .intro {
    font-size: 14px;
  }
  .message {
    width: min(62vw, 460px);
    padding: 27px;
  }
  .footer {
    bottom: 25px;
  }
}

@media (max-height: 650px) {
  .top {
    top: max(10px, env(safe-area-inset-top));
  }
  h1 {
    font-size: 25px;
    margin: 5px;
  }
  .intro {
    font-size: 11px;
  }
  .message {
    width: min(82vw, 390px);
    padding: 15px;
  }
  .quote {
    font-size: 19px;
    margin: 8px 0;
  }
  .tap-hint {
    top: calc(55% + 31vw);
    padding: 6px 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .angel-motion,
  .tap-hint {
    animation: none;
  }
  .screen.flare,
  .screen.flare:after,
  .message.visible {
    animation-duration: .01ms;
    animation-iteration-count: 1;
  }
}
</style>
</head>

<body>
<main class="screen" id="screen"
  style="--art:url('./arcanjos-realistas.png')"
  aria-label="Oráculo dos Arcanjos em tela cheia">

  <span class="angel-motion a1" aria-hidden="true"></span>
  <span class="angel-motion a2" aria-hidden="true"></span>
  <span class="angel-motion a3" aria-hidden="true"></span>
  <span class="angel-motion a4" aria-hidden="true"></span>
  <span class="angel-motion a5" aria-hidden="true"></span>
  <span class="angel-motion a6" aria-hidden="true"></span>
  <span class="angel-motion a7" aria-hidden="true"></span>

  <header class="top">
    <div class="eyebrow">uma mensagem de luz para o seu dia</div>
    <h1>Oráculo dos Arcanjos</h1>
    <p class="intro">Respire fundo. Toque no sol e receba sua inspiração.</p>
  </header>

  <button class="music-toggle" id="music" type="button"
    aria-label="Ativar música angelical" aria-pressed="false">♫</button>
  <span class="music-status" id="musicStatus">Música</span>

  <button class="sun-button" id="sun"
    aria-label="Tocar no sol e sortear uma mensagem"></button>
  <div class="tap-hint" id="hint">✧ TOQUE NO SOL ✧</div>

  <section class="message hidden" id="message"
    aria-live="polite" aria-atomic="true" role="button" tabindex="0"
    aria-label="Toque para fechar a mensagem e voltar ao sol">
    <div class="label" id="label">Sua mensagem do dia</div>
    <p class="quote" id="quote"></p>
    <div class="source">✧ Uma inspiração para acompanhar você hoje ✧</div>
    <div class="dismiss">TOQUE NA MENSAGEM PARA FECHAR</div>
  </section>

  <div class="footer">
    <span class="star">✦</span>
    Que a luz acompanhe seus passos
    <span class="star">✦</span>
  </div>
</main>

<script>
const frases = [
  ['A coragem que você procura já vive dentro de você. Dê o próximo passo com confiança.', 'Conselho para hoje'],
  ['Cuide da sua paz: nem toda batalha merece a sua energia.', 'Lembrete do dia'],
  ['Um pequeno passo ainda é um passo na direção dos seus sonhos. Continue.', 'Inspiração'],
  ['Permita-se recomeçar. Cada amanhecer traz uma nova possibilidade.', 'Mensagem de esperança'],
  ['Você não precisa resolver tudo agora. Respire e escolha apenas o próximo passo.', 'Conselho para hoje'],
  ['Fale consigo com carinho: você está aprendendo, não precisa ser perfeito.', 'Lembrete do dia'],
  ['A gentileza que você oferece ao mundo também pode começar por você.', 'Mensagem de amor'],
  ['Confie no processo: florescer também leva tempo.', 'Inspiração'],
  ['“Seja forte e corajoso; não tenha medo.”', 'Josué 1:9 · inspiração'],
  ['“Tudo o que é verdadeiro, nobre e amável, nisso pensem.”', 'Filipenses 4:8 · inspiração'],
  ['“Acima de tudo, revistam-se do amor.”', 'Colossenses 3:14 · inspiração'],
  ['A sua história não termina nos dias difíceis. Ainda há luz adiante.', 'Mensagem de esperança'],
  ['Escute com o coração. Às vezes, a resposta chega quando desaceleramos.', 'Conselho para hoje'],
  ['Soltar o que passou abre espaço para acolher o que está chegando.', 'Reflexão do dia']
];

let anterior = -1;
let audioContext = null;
let musicMaster = null;
let fxMaster = null;
let pads = [];
let musicEnabled = false;
let chordTimer = null;
let bellTimer = null;
let beatTimer = null;
let chordIndex = 0;
let beatIndex = 0;

const progression = [
  [65.41, 130.81, 196, 261.63, 329.63],
  [87.31, 174.61, 261.63, 349.23, 440],
  [55, 110, 164.81, 220, 329.63],
  [49, 98, 146.83, 196, 293.66]
];

const levels = [.19, .15, .12, .085, .055];

const arps = [
  [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 587.33, 783.99],
  [523.25, 698.46, 880, 1046.5, 880, 698.46, 784, 880],
  [440, 523.25, 659.25, 880, 784, 659.25, 523.25, 659.25],
  [392, 493.88, 587.33, 783.99, 987.77, 880, 783.99, 587.33]
];

function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;

  if (!audioContext) {
    audioContext = new Ctx();

    const padFilter = audioContext.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 1450;

    const leadFilter = audioContext.createBiquadFilter();
    leadFilter.type = 'lowpass';
    leadFilter.frequency.value = 4200;

    musicMaster = audioContext.createGain();
    musicMaster.gain.value = .0001;

    padFilter.connect(musicMaster);
    leadFilter.connect(musicMaster);
    musicMaster.connect(audioContext.destination);

    fxMaster = audioContext.createGain();
    fxMaster.gain.value = .24;
    fxMaster.connect(audioContext.destination);

    progression[0].forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = i === 0 ? 'sine' : 'triangle';
      osc.frequency.value = freq;
      gain.gain.value = levels[i];

      osc.connect(gain);
      gain.connect(padFilter);
      osc.start();
      pads.push(osc);
    });

    chordIndex = 0;
  }

  if (audioContext.state === 'suspended') audioContext.resume();
  return true;
}

function setChord(index) {
  chordIndex = index % progression.length;
  const now = audioContext.currentTime;

  progression[chordIndex].forEach((f, i) => {
    pads[i].frequency.setTargetAtTime(f, now, 1.2);
  });
}

function playPulse(freq, volume, duration, type = 'triangle') {
  const o = audioContext.createOscillator();
  const g = audioContext.createGain();
  const t = audioContext.currentTime;

  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(volume, t + .018);
  g.gain.exponentialRampToValueAtTime(.0001, t + duration);

  o.connect(g);
  g.connect(musicMaster);
  o.start(t);
  o.stop(t + duration + .02);
}

function playArpStep() {
  if (!audioContext || !musicEnabled) return;

  const pattern = arps[chordIndex];
  const note = pattern[beatIndex % pattern.length];

  playPulse(
    note,
    beatIndex % 4 === 0 ? .2 : .145,
    .25,
    beatIndex % 4 === 0 ? 'sine' : 'triangle'
  );

  if (beatIndex % 4 === 0) {
    playPulse(progression[chordIndex][0] * 2, .12, .32, 'sine');
  }

  beatIndex++;
}

function playAmbientBell() {
  if (!audioContext || !musicEnabled) return;

  const notes = [1046.5, 1318.5, 1568, 1174.7, 1760];
  const freq = notes[Math.floor(Math.random() * notes.length)];
  const o = audioContext.createOscillator();
  const g = audioContext.createGain();
  const t = audioContext.currentTime;

  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.045, t + .08);
  g.gain.exponentialRampToValueAtTime(.0001, t + 3.2);

  o.connect(g);
  g.connect(musicMaster);
  o.start(t);
  o.stop(t + 3.3);
}

function setMusic(on) {
  if (!ensureAudio()) return;

  musicEnabled = on;
  const now = audioContext.currentTime;

  musicMaster.gain.cancelScheduledValues(now);
  musicMaster.gain.setTargetAtTime(on ? .24 : .0001, now, on ? .65 : .35);

  const btn = document.getElementById('music');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute(
    'aria-label',
    on ? 'Desativar música angelical' : 'Ativar música angelical'
  );

  document.getElementById('musicStatus').textContent =
    on ? 'Música ligada' : 'Música';

  if (on) {
    setChord(chordIndex);

    if (!chordTimer) {
      chordTimer = setInterval(() => setChord(chordIndex + 1), 7200);
    }

    if (!beatTimer) {
      playArpStep();
      beatTimer = setInterval(playArpStep, 340);
    }

    if (!bellTimer) {
      bellTimer = setInterval(playAmbientBell, 6200);
    }
  } else {
    clearInterval(chordTimer);
    clearInterval(bellTimer);
    clearInterval(beatTimer);
    chordTimer = bellTimer = beatTimer = null;
  }
}

function tocarSino() {
  if (!ensureAudio()) return;

  const now = audioContext.currentTime;

  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const o = audioContext.createOscillator();
    const g = audioContext.createGain();
    const t = now + i * .075;

    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.018, t + .42);

    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.16 / (i + 1), t + .035);
    g.gain.exponentialRampToValueAtTime(.0001, t + .88);

    o.connect(g);
    g.connect(fxMaster);
    o.start(t);
    o.stop(t + .9);
  });
}

const sun = document.getElementById('sun');
const screen = document.getElementById('screen');
const message = document.getElementById('message');
const hint = document.getElementById('hint');
const musicBtn = document.getElementById('music');

function fecharMensagem() {
  message.classList.remove('visible');
  message.classList.add('hidden');
  hint.style.opacity = '1';
}

sun.addEventListener('click', () => {
  if (!musicEnabled) setMusic(true);

  let n;
  do {
    n = Math.floor(Math.random() * frases.length);
  } while (n === anterior);

  anterior = n;

  document.getElementById('label').textContent = frases[n][1];
  document.getElementById('quote').textContent = '“' + frases[n][0] + '”';

  message.classList.remove('hidden', 'visible');
  void message.offsetWidth;
  message.classList.add('visible');

  screen.classList.remove('flare');
  void screen.offsetWidth;
  screen.classList.add('flare');

  hint.style.opacity = '0';
  tocarSino();
});

message.addEventListener('click', fecharMensagem);

message.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    fecharMensagem();
  }
});

musicBtn.addEventListener('click', () => setMusic(!musicEnabled));
</script>
</body>
</html>
