.message{position:absolute;z-index:9;left:50%;top:55%;transform:translate(-50%,-50%);width:min(84vw,410px);padding:23px 21px 20px;border:1px solid #fff0b6;border-radius:24px;background:linear-gradient(145deg,#1c1739e8,#231b38d9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 16px #fff1bdc9,0 0 52px 14px #ffdb78a6,inset 0 0 34px #ffe9a333;text-align:center;cursor:pointer;touch-action:manipulation}.message.hidden{display:none}.message.visible{animation:deep-emerge 1.65s cubic-bezier(.16,.86,.2,1) both}@keyframes deep-emerge{0%{opacity:0;clip-path:circle(0% at 50% 50%);transform:translate(-50%,-50%) scale(.08);filter:brightness(3.3) blur(12px);box-shadow:0 0 0 #fff}22%{opacity:.35;clip-path:circle(18% at 50% 50%);transform:translate(-50%,-50%) scale(.32);filter:brightness(2.4) blur(5px);box-shadow:0 0 80px 40px #fff1aacc}58%{opacity:1;clip-path:circle(85% at 50% 50%);transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.3) blur(0);box-shadow:0 0 26px #fff1bd,0 0 80px 25px #ffdb78b5,inset 0 0 40px #ffe9a355}100%{opacity:1;clip-path:circle(150% at 50% 50%);transform:translate(-50%,-50%) scale(1);filter:brightness(1);box-shadow:0 0 16px #fff1bdc9,0 0 52px 14px #ffdb78a6,inset 0 0 34px #ffe9a333}}.label{font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.quote{font-size:clamp(20px,5.4vw,27px);line-height:1.38;margin:12px 0 9px;text-shadow:0 1px 10px #000}.source{font:11px Arial,sans-serif;color:#e1d5e9}.dismiss{font:9px Arial,sans-serif;color:#ffe9bcaa;margin-top:12px;letter-spacing:.09em}.footer{position:absolute;z-index:8;left:12px;right:12px;bottom:max(17px,env(safe-area-inset-bottom));text-align:center;color:#fff1d4;font:11px Arial,sans-serif;letter-spacing:.04em;text-shadow:0 2px 12px #000}.star{color:var(--gold)}@media(min-width:700px){.screen{background-position:center 52%}.top{top:28px}.intro{font-size:14px}.message{width:min(62vw,460px);padding:27px}.footer{bottom:25px}}@media(max-height:6 <header class="top"><div class="eyebrow">uma mensagem de luz para o seu dia</div><h1>Oráculo dos Arcanjos</h1><p class="intro">Respire fundo. Toque no sol e receba sua inspiração.</p></header><button class="music-toggle" id="music" type="button" aria-label="Ativar música angelical" aria-pressed="false">♫</button><span class="music-status" id="musicStatus">Música</span>

</main><script>const frases=[['A coragem que você procura já vive dentro de você. Dê o próximo passo com confiança.','Conselho para hoje'],['Cuide da sua paz: nem toda batalha merece a sua energia.','Lembrete do dia'],['Um pequeno passo ainda é um passo na direção dos seus sonhos. Continue.','Inspiração'],['Permita-se recomeçar. Cada amanhecer traz uma nova possibilidade.','Mensagem de esperança'],['Você não precisa resolver tudo agora. Respire e escolha apenas o próximo passo.','Conselho para hoje'],['Fale consigo com carinho: você está aprendendo, não precisa ser perfeito.','Lembrete do dia'],['A gentileza que você oferece ao mundo também pode começar por você.','Mensagem de amor'],['Confie no processo: florescer também leva tempo.','Inspiração'],['“Seja forte e corajoso; não tenha medo.”','Josué 1:9 · inspiração'],['“Tudo o que é verdadeiro, nobre e amável, nisso pensem.”','Filipenses 4:8 · inspiração'],['“Acima de tudo, revistam-se do amor.”','Colossenses 3:14 · inspiração'],['A sua história não termina nos dias difíceis. Ainda há luz adiante.','Mensagem de esperança'],['Escute com o coração. Às vezes, a resposta chega quando desaceleramos.','Conselho para hoje'],['Soltar o que passou abre espaço para acolher o que está chegando.','Reflexão do dia']];
let anterior=-1,audioContext=null,musicMaster=null,fxMaster=null,pads=[],musicEnabled=false,chordTimer=null,bellTimer=null,beatTimer=null,chordIndex=0,beatIndex=0;const progression=[[65.41,130.81,196,261.63,329.63],[87.31,174.61,261.63,349.23,440],[55,110,164.81,220,329.63],[49,98,146.83,196,293.66]],levels=[.19,.15,.12,.085,.055],arps=[[523.25,659.25,783.99,1046.5,783.99,659.25,587.33,783.99],[523.25,698.46,880,1046.5,880,698.46,784,880],[440,523.25,659.25,880,784,659.25,523.25,659.25],[392,493.88,587.33,783.99,987.77,880,783.99,587.33]];
function ensureAudio(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;if(!audioContext){audioContext=new Ctx();const padFilter=audioContext.createBiquadFilter();padFilter.type='lowpass';padFilter.frequency.value=1450;const leadFilter=audioContext.createBiquadFilter();leadFilter.type='lowpass';leadFilter.frequency.value=4200;musicMaster=audioContext.createGain();musicMaster.gain.value=.0001;padFilter.connect(musicMaster);leadFilter.connect(musicMaster);musicMaster.connect(audioContext.destination);fxMaster=audioContext.createGain();fxMaster.gain.value=.24;fxMaster.connect(audioContext.destination);progression[0].forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=i===0?'sine':'triangle';osc.frequency.value=freq;gain.gain.value=levels[i];osc.connect(gain);gain.connect(padFilter);osc.start();pads.push(osc)});chordIndex=0}if(audioContext.state==='suspended')audioContext.resume();return true}
function setChord(index){chordIndex=index%progression.length;const now=audioContext.currentTime;progression[chordIndex].forEach((f,i)=>pads[i].frequency.setTargetAtTime(f,now,1.2))}
function playPulse(freq,volume,duration,type='triangle'){const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(musicMaster);o.start(t);o.stop(t+duration+.02)}
function playArpStep(){if(!audioContext||!musicEnabled)return;const pattern=arps[chordIndex],note=pattern[beatIndex%pattern.length];playPulse(note,beatIndex%4===0 ? .2 : .145,.25,beatIndex%4===0?'sine':'triangle');if(beatIndex%4===0)playPulse(progression[chordIndex][0]*2,.12,.32,'sine');beatIndex++}
function playAmbientBell(){if(!audioContext||!musicEnabled)return;const notes=[1046.5,1318.5,1568,1174.7,1760],freq=notes[Math.floor(Math.random()*notes.length)],o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(musicMaster);o.start(t);o.stop(t+3.3)}
function setMusic(on){if(!ensureAudio())return;musicEnabled=on;const now=audioContext.currentTime;musicMaster.gain.cancelScheduledValues(now);musicMaster.gain.setTargetAtTime(on ? .24 : .0001,now,on ? .65 : .35);const btn=document.getElementById('music');btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',on?'Desativar música angelical':'Ativar música angelical');document.getElementById('musicStatus').textContent=on?'Música ligada':'Música';if(on){setChord(chordIndex);if(!chordTimer)chordTimer=setInterval(()=>setChord(chordIndex+1),7200);if(!beatTimer){playArpStep();beatTimer=setInterval(playArpStep,340)}if(!bellTimer)bellTimer=setInterval(playAmbientBell,6200)}else{clearInterval(chordTimer);clearInterval(bellTimer);clearInterval(beatTimer);chordTimer=bellTimer=beatTimer=null}}
function tocarSino(){if(!ensureAudio())return;const now=audioContext.currentTime;[523.25,659.25,783.99,1046.5].forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=now+i*.075;o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.018,t+.42);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16/(i+1),t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+.88);o.connect(g);g.connect(fxMaster);o.start(t);o.stop(t+.9)})}
const sun=document.getElementById('sun'),screen=document.getElementById('screen'),message=document.getElementById('message'),hint=document.getElementById('hint'),musicBtn=document.getElementById('music');function fecharMensagem(){message.classList.remove('visible');message.classList.add('hidden');hint.style.opacity='1'}sun.addEventListener('click',()=>{if(!musicEnabled)setMusic(true);let n;do{n=Math.floor(Math.random()*frases.length)}while(n===anterior);anterior=n;document.getElementById('label').textContent=frases[n][1];document.getElementById('quote').textContent='“'+frases[n][0]+'”';message.classList.remove('hidden','visible');void message.offsetWidth;message.classList.add('visible');screen.classList.remove('flare');void screen.offsetWidth;screen.classList.add('flare');hint.style.opacity='0';tocarSino()});message.addEventListener('click',fecharMensagem);message.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fecharMensagem()}});musicBtn.addEventListener('click',()=>setMusic(!musicEnabled));</script></body></html>
